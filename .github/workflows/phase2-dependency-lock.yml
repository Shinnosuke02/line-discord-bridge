name: phase2 dependency lock sync

on:
  push:
    branches:
      - phase2-modernization
    paths:
      - package.json
      - .github/workflows/phase2-dependency-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-modernization
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock
        run: |
          if git diff --quiet package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh Phase 2 dependency lock"
          git push origin HEAD:phase2-modernization
