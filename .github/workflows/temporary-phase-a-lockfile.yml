# Temporary, branch-scoped lockfile generator. DELETE before merge.
name: temporary-phase-a-lockfile
on:
  push:
    branches:
      - chore/phase-a-js-typecheck
    paths:
      - .github/workflows/temporary-phase-a-lockfile.yml
permissions:
  contents: write
jobs:
  resolve-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      LINE_CHANNEL_SECRET: test-line-secret
      LINE_CHANNEL_ACCESS_TOKEN: test-line-token
      DISCORD_BOT_TOKEN: test-discord-token
      DISCORD_GUILD_ID: '123456789012345678'
      DB_FILE: /tmp/line-discord-bridge-test.sqlite3
      DB_BACKUP_PATH: /tmp/line-discord-bridge-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/phase-a-js-typecheck
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
      - name: Resolve dev-only package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate locked install
        run: npm ci
      - name: Type-check JavaScript opt-in
        run: npm run typecheck
      - name: Test and lint
        run: |
          npm test -- --runInBand
          npm run lint
          npm audit --omit=dev --audit-level=high
      - name: Commit package-lock.json to isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock already matches package.json"
            exit 0
          fi
          git commit -m "chore: lock TypeScript 5.9.3 and Node 24 types"
          git push origin HEAD:chore/phase-a-js-typecheck
