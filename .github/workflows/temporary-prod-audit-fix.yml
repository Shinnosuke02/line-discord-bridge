# Temporary CI-only remediation helper; REMOVE before merging.
# Only the audit branch is writable and no production credentials are used.
name: temporary-prod-audit-fix
on:
  push:
    branches:
      - audit/2026-10-compatibility-safety
    paths:
      - .github/workflows/temporary-prod-audit-fix.yml
permissions:
  contents: write
jobs:
  fix-prod-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      LINE_CHANNEL_SECRET: test-line-secret
      LINE_CHANNEL_ACCESS_TOKEN: test-line-token
      DISCORD_BOT_TOKEN: test-discord-token
      DISCORD_GUILD_ID: '123456789012345678'
      DB_FILE: /tmp/line-discord-bridge-test.sqlite3
      DB_BACKUP_PATH: /tmp/line-discord-bridge-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/2026-10-compatibility-safety
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
      - name: Fix audited production dependencies within existing semver ranges
        run: npm audit fix --package-lock-only --omit=dev
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install, test, lint and SQLite smoke
        run: |
          npm ci
          npm test -- --runInBand
          npm run lint
          node -e "const db=require('./src/infrastructure/sqlite'); db.getDatabase(); db.closeDatabase();"
          npm run db:status
      - name: Commit lockfile only to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change"
            exit 0
          fi
          git commit -m "security: resolve October 2026 production audit advisories"
          git push origin HEAD:audit/2026-10-compatibility-safety
