name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # package-lock.json is intentionally refreshed after the embedded SQLite
      # dependency lands. npm install keeps this workflow usable during the
      # stacked reliability migration without requiring a system sqlite package.
      - name: Install dependencies
        run: npm install --ignore-scripts=false

      - name: Run tests
        env:
          NODE_ENV: test
          LINE_CHANNEL_SECRET: test-line-secret
          LINE_CHANNEL_ACCESS_TOKEN: test-line-token
          DISCORD_BOT_TOKEN: test-discord-token
          DISCORD_GUILD_ID: '123456789012345678'
          DB_FILE: ${{ runner.temp }}/line-discord-bridge-test.sqlite3
        run: npm test -- --runInBand

      - name: Run lint
        run: npm run lint
