name: sync-lockfile

on:
  push:
    branches:
      - feat/v3.2-durable-inbox

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v3.2-durable-inbox
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts=false
      - name: Commit refreshed lockfile when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock for SQLite"
          git push origin HEAD:feat/v3.2-durable-inbox
